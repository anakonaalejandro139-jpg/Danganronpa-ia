name: Build Android APK and Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android & compile Debug APK
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaberMortal11-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Package Windows EXE with Electron Builder
        run: |
          npm install --no-save electron electron-builder
          npx electron-builder --win --config electron-builder.json

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaberMortal11-Windows-EXE
          path: release/*.exe
